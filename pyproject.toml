[build-system]
requires = ["setuptools>=78.2", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-convert-from-sisense"
version = "1.1.0"
description = "Sisense dashboard -> ThoughtSpot Model, Answers and Liveboard (standalone ts-convert-from-sisense skill)"
requires-python = ">=3.10,<3.15"
dependencies = [
    "typer>=0.12,<1",
    "requests>=2.33.0",
    "PyYAML>=6.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
ts = "ts_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ts_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
